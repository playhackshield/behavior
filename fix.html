<!DOCTYPE html>
<html>
<head>
    <title>Fix studentCount</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Fix studentCount</h1>
    <button onclick="fixCounts()">Start</button>
    <pre id="output"></pre>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCO2ndD-lTBZpRrs-ZxIsBTVjPVza2sFXU",
            authDomain: "schoolquizapp-28abf.firebaseapp.com",
            projectId: "schoolquizapp-28abf",
            storageBucket: "schoolquizapp-28abf.firebasestorage.app",
            messagingSenderId: "921022621334",
            appId: "1:921022621334:web:ef582f1e067a77a41284b7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function fixCounts() {
            const out = document.getElementById('output');
            out.textContent = 'Bezig...\n';
            const classesSnap = await db.collection('classes').get();
            for (const classDoc of classesSnap.docs) {
                const classId = classDoc.id;
                const studentsSnap = await db.collection('students')
                    .where('classId', '==', classId).get();
                const realCount = studentsSnap.size;
                const oldCount = classDoc.data().studentCount || 0;
                if (realCount !== oldCount) {
                    await db.collection('classes').doc(classId).update({
                        studentCount: realCount
                    });
                    out.textContent += `✓ ${classDoc.data().name}: ${oldCount} → ${realCount}\n`;
                } else {
                    out.textContent += `= ${classDoc.data().name}: ${realCount} (ongewijzigd)\n`;
                }
            }
            out.textContent += '\nKlaar.';
        }
    </script>
</body>
</html>
